<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <h2>Employee Dashboard</h2>
            <button id="refreshEmployees" class="refresh-btn" title="Refresh Employees">🔄</button>
        </header>

        <!-- A. NEW: Status message (error / info) -->
        <p id="statusMessage" class="status-message"></p>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-box">
                <div class="spinner"></div>
                <p>Loading employees...</p>
            </div>
        </div>


        <!-- Dashboard Cards -->
        <div class="dashboard">

            <div class="dashboard-card employees-card">
                <div class="card-title">👥 Employees</div>
                <div class="card-value" id="employeeCount">3</div>
            </div>

            <div class="dashboard-card salary-card">
                <div class="card-title">💰 Salary Budget</div>
                <div class="card-value" id="salaryBudget">₹1,80,000</div>
            </div>

            <div class="dashboard-card average-card">
                <div class="card-title">📈 Avg Salary</div>
                <div class="card-value" id="averageSalary">₹60,000</div>
            </div>

        </div>


        <!-- Search Employee -->
        <section class="box search-box">
            <h4>Search Employee 🔍</h4>
            <input type="text" id="searchEmployee" placeholder="Search by name or department...">
        </section>


        <!-- Employee List -->
        <section class="box">

            <h4>Employee List</h4>

            <!-- B. NEW: Department filter + Salary sort -->
            <div class="list-controls">

                <select id="departmentFilter">
                    <option value="All">All</option>
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                </select>

                <select id="salarySort">
                    <option value="none">Sort by Salary</option>
                    <option value="high-low">Salary: High to Low</option>
                    <option value="low-high">Salary: Low to High</option>
                </select>
                
                 <select id="nameSort">
                    <option value="none">Sort by Name</option>
                    <option value="name-asc">Name: A to Z</option>
                    <option value="name-des">Name: Z to A</option>
                </select>

            </div>

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">

                </tbody>

            </table>

        </section>


        <!-- Add Employee -->
        <section class="box add-employee">

            <h4>Add Employee</h4>

            <!-- C. NEW: form wrapper, so the submit event works -->
            <form id="addEmployeeForm">

                <div class="form-row">
                    <label for="name">Name :</label>
                    <input type="text" id="name" placeholder="Enter name">
                </div>

                <div class="form-row">
                    <label for="dept">Dept :</label>
                    <select id="dept">
                        <option value="None">Select Dept</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="salary">Salary :</label>
                    <input type="number" id="salary" placeholder="Enter salary">
                </div>

                <div class="button-container">
                    <!-- type="submit" instead of a plain button -->
                    <button type="submit" id="addEmployee">
                        [+ Add Employee]
                    </button>
                </div>

            </form>

        </section>


        <!-- Department Distribution -->
        <section class="box department-box">

            <h4>Department Distribution</h4>

            <ul id="departmentList">

                <li class="it">
                    <span>IT :</span>
                    <span id="itCount">1</span>
                </li>

                <li class="hr">
                    <span>HR :</span>
                    <span id="hrCount">1</span>
                </li>

                <li class="finance">
                    <span>Finance :</span>
                    <span id="financeCount">1</span>
                </li>

            </ul>

        </section>

    </div>

</body>

</html>
